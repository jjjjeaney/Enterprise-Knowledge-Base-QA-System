server {
    listen 80;

    # 默认 1MB。上传文档的 /ingest 走这里，不改的话直接 413。
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # 反代到 app 容器。末尾的 / 会剥掉 /api 前缀：/api/chat -> app:8000/chat。
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60s。前端 axios 等 180s，这里必须给更大，否则长回答会被 nginx
        # 先掐成 504，前端看到的是"后端超时"，排查会往错误的方向走。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 专给接口文档用的一条。/docs 那个自定义路由里 openapi_url 写的是
    # `/openapi-swagger.json`（**绝对根路径**），所以 Swagger UI 会直接请求根上的这个
    # 路径，而不是 /api/ 下面。app 不再发布 8000 之后，不加这条接口文档就彻底打不开
    # （浏览器会拿到 index.html，然后报 JSON 解析失败）。
    # 加了之后文档在 http://localhost:5173/api/docs
    location = /openapi-swagger.json {
        proxy_pass http://app:8000/openapi-swagger.json;
        proxy_set_header Host $host;
    }
}